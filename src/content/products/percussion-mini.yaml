faq:
  - q: Where should I use it?
    a: Large muscles such as calves, quads, glutes, and the muscles of the back away from the spine. Not the front of the neck, the head, the spine, or joints.
  - q: How hot does the head get?
    a: The warm range is 95 to 113 °F (35 to 45 °C). The cool range is 50 to 68 °F (10 to 20 °C).
  - q: Do I need an app?
    a: No. There is no app and no subscription.
  - q: What is it for?
    a: Temporary relief of minor muscle aches. It is a short session, then you stop.
precautions:
  - Do not use on the front of the neck, the head, the spine, or joints.
  - Do not use on bruises or broken skin.
  - Pregnant, or have a health condition? Ask your doctor first.
  - 'TBD: max 2 minutes per spot.'
  - Not for children.
