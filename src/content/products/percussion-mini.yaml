howToUse:
  - title: Pick a head and a speed
    text: Start on the low speed. Use the warm and cool head only on large muscles.
  - title: Keep it moving
    text: Glide over the muscle. Do not park it on a bone, joint, or the spine.
  - title: Stop when the timer does
    text: 'It shuts off at 15 minutes. TBD: max 2 minutes on one spot.'
