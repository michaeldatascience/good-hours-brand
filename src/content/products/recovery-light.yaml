faq:
  - q: How long should a session be?
    a: Most people use it for 10 to 15 minutes. The timer goes up to 20.
  - q: Do I need an app?
    a: No. There is no app and no subscription.
  - q: Can I take it on a plane?
    a: "TBD: confirm battery rules. It fits in a carry-on."
  - q: Does it get hot?
    a: It feels gently warm. It is not a heater.
precautions:
  - Wear the included goggles. Do not look straight into the light.
  - Do not use on broken skin or if you are sensitive to light.
  - Pregnant, have an implanted device, or have a health condition? Ask your doctor first.
  - Not for children.
